name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require tag on main
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if [ "$MAIN_SHA" != "$TAG_SHA" ]; then
            echo "error: tag $GITHUB_REF_NAME is not on main ($MAIN_SHA != $TAG_SHA); refusing to release" >&2
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify modules
        run: go mod verify

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2.0"
          args: check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release archives and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          cd release-assets
          sha256sum -c checksums.txt
          for archive in *.tar.gz; do
            tar -tzf "$archive" | grep -qx './devpulse' || tar -tzf "$archive" | grep -qx 'devpulse'
          done
          for archive in *.zip; do
            unzip -Z1 "$archive" | grep -qx 'devpulse.exe'
          done
