name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Print release context
        run: |
          echo "::group::Release context"
          echo "Tag:        $GITHUB_REF_NAME"
          echo "Commit:     $GITHUB_SHA"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner:     $RUNNER_OS"
          go version
          echo "::endgroup::"

      - name: Require tag on main
        run: |
          echo "::group::Tag/main guard"
          MAIN_SHA=$(git rev-parse origin/main)
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          echo "main HEAD: $MAIN_SHA"
          echo "tag commit: $TAG_SHA"
          if [ "$MAIN_SHA" != "$TAG_SHA" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not on main ($MAIN_SHA != $TAG_SHA); refusing to release"
            exit 1
          fi
          echo "::endgroup::"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Release $GITHUB_REF_NAME"
            echo ""
            echo "Triggered by tag: \`$GITHUB_REF_NAME\` on commit \`$GITHUB_SHA\`"
            echo ""
            echo "### Artifacts"
            echo '```text'
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
            echo '```'
            echo ""
            echo "See the full release at:"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
