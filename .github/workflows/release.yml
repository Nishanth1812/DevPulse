name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require tag on main
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if [ "$MAIN_SHA" != "$TAG_SHA" ]; then
            echo "error: tag $GITHUB_REF_NAME is not on main ($MAIN_SHA != $TAG_SHA); refusing to release" >&2
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}